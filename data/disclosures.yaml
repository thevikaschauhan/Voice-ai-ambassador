# Call-opening disclosure, spoken by the SYSTEM before the model says
# anything, in the selected language. Fixed copy: a disclosure the model
# composes can vary, and one that varies is not a disclosure (ADR-013).
# The opening ignores barge-in so it always completes (docs/04-).
# Copy says "transcribed", not "recorded": the POC stores no raw audio and
# the notice must match what is actually retained.
#
# Loaded by agent/src/adapter/disclosure.py and spoken from the agent's
# on_enter hook. This file had no loader at all until then, so none of the
# above was happening in any language, English included.
#
# A LANGUAGE WITH NO COPY HERE CANNOT OPEN A CALL. Emptiness is not a
# formatting detail: it is the readiness signal the session gate reads, and an
# empty entry makes the agent refuse to start in that language. Setting
# ALLOW_UNCERTIFIED_LANGUAGE=true opens in English instead and marks the event
# stream `uncertified_fallback: true`, which is the graceful-degradation demo
# docs/04- asks for - not a way to ship an unreviewed language quietly.
#
# TWO SHAPES, and the difference is only whether the ambassador has a name.
#
#   a plain string      the sentence, spoken as written. The shape every entry
#                       had before names existed, and still the right one for a
#                       language whose ambassador is unnamed.
#   a mapping           `unnamed:` is that same sentence and is REQUIRED - it
#                       is what makes the language openable at all, and it is
#                       what gets spoken if the name is ever cleared.
#                       `named:` is optional, carries `{name}`, and is used
#                       only when data/ambassadors.yaml has a name for this
#                       language.
#
# Both forms are authored, both are read aloud, and a reviewer signs off on
# both: a sentence that only reads correctly with a name substituted into it is
# a sentence nobody has actually checked. If `named:` is missing while a name
# exists, the unnamed sentence is spoken - the disclosure still happens, it
# just does not use the name. There is deliberately no rendering path that can
# produce "You are speaking with , Binghatti's AI ambassador".

en:
  named: >
    You are speaking with {name}, Binghatti's AI ambassador. This conversation
    is transcribed so our team can assist you. You can ask for a person at any
    time.
  unnamed: >
    You are speaking with Binghatti's AI ambassador. This conversation is
    transcribed so our team can assist you. You can ask for a person at any
    time.

ar: ""
  # VERIFY: native-authored Arabic disclosure. The call must not ship in
  # Arabic until this exists and has been reviewed, and now it cannot: with
  # this empty, LANGUAGE=ar refuses to start. When it arrives, it comes as the
  # mapping above if the ambassador has an Arabic name by then, and as a plain
  # string if she does not.

hi: ""
  # VERIFY: native-authored Hindi disclosure. Same rule, same enforcement, same
  # two shapes.
