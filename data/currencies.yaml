# Buyer-side currency recognition and conversion (ADR-011, docs/04-).
#
# This is INPUT recognition - the words a buyer says next to a number - and is
# a different list from `currency_tokens` in spoken-forms.yaml, which is the
# written tokens the OUTPUT swallows. A buyer says "rupees"; the agent never
# writes it.
#
# Why any of this exists: "do crore ka budget hai" is two crore of WHAT. INR
# 2 crore is roughly AED 880k; AED 2 crore is 20 million. Guessing wrong
# recommends a property off by up to 20x, in a warm confident voice.

# THE RATE IS NOT SET, AND THAT IS DELIBERATE.
#
# A made-up exchange rate spoken to a buyer is the same class of error as a
# made-up price: a specific, checkable, wrong number said with confidence.
# While `confirmed` is false the agent does not convert at all - it confirms
# the currency and hands a non-AED budget to a human, which is the honest
# answer and one worth showing.
#
# To switch conversion on, an operator sets a real rate, dates it, and flips
# `confirmed`. Nothing else changes.
rate:
  inr_per_aed: null
  as_of: null
  confirmed: false
  # VERIFY: with Binghatti's finance contact - the rate they quote buyers, and
  # how often it is refreshed. A stale rate is a wrong rate.

# Per language, because a buyer says the currency in the language they are
# speaking. Matched case-insensitively as whole words against the transcript.
words:
  en:
    AED: [aed, dirham, dirhams, dhs, dh]
    INR: [inr, rupee, rupees, rs]
  ar:
    AED: []
    INR: []
    # VERIFY: native-authored. Until these exist, an Arabic buyer naming a
    # currency reads as unstated, so the agent asks - which is the safe
    # direction, and no worse than not asking.
  hi:
    AED: []
    INR: []
    # VERIFY: native-authored. Same rule.

# Symbols are language-neutral: a transcript carries them whatever is spoken.
symbols:
  AED: []
  INR: ["₹"]

# Words that mark a number as a BUDGET rather than a bedroom count or a floor.
# Without these "three bedrooms" reads as a budget mention. A number carrying a
# currency or a lakh/crore/million multiplier needs no keyword - those say it
# on their own. Matched within a short window of the figure, not across the
# whole utterance, and kept to words that are ABOUT money: "around" and
# "looking at" were in this list once, and "I'm around floor 15" read as a
# budget of 15.
budget_keywords:
  en: [budget, spend, spending, afford, price range, up to, maximum, max]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# Attribution: words that say a figure came from SOMEBODY ELSE - a listing, a
# brochure, our own website, us on an earlier call - or that frame it as a
# price rather than as what the buyer will spend.
#
# Why this list exists. `find_budget` treated any figure carrying a currency or
# a lakh/crore/million unit as a budget mention, so "the listing says AED
# 750,000" was read back as "750,000 - have I got that right?" - and because
# the policy takes the turn, the buyer's actual question went unanswered. Worse,
# a confirmed figure SETTLES the policy, and a settled policy never speaks
# again: one quoted price suppressed every real budget mention for the rest of
# the call.
#
# The direction here is the opposite of the budget keywords above, so read it
# carefully before adding a word. A missed budget is an unconfirmed
# twenty-times risk; an extra read-back costs one question. So these words only
# ever WITHHOLD a mention, they bind within a tight window of the figure they
# frame (much tighter than a budget keyword's reach), and a budget keyword
# beside the same figure outranks them - "the listing says AED 750,000 but my
# budget is 2 million" is still a budget of 2 million.
attributions:
  en:
    # Where the figure came from.
    - listing
    - listings
    - brochure
    - website
    - advert
    - portal
    - "you said"
    - "you quoted"
    - "you mentioned"
    # Third-person reported speech. Never bare "said": "I said 2 crore" is the
    # buyer restating their own budget, and withholding that is the expensive
    # direction. "My agent said 750,000" IS withheld, correctly - the buyer is
    # relaying someone else's figure.
    - agent
    - "they said"
    - "he said"
    - "she said"
    - "someone said"
    - "i saw"
    - "i read"
    - "i heard"
    - quotes
    - quoted
    # Framed as a price rather than as a budget.
    - price
    - prices
    - priced
    - asking
    - "listed at"
    - "goes for"
    - "starts from"
    - "starts at"
    - "start at"
    - "starting from"
    - "starting at"
  ar: []
  # VERIFY: native-authored. Until these exist an Arabic buyer quoting a
  # listing back has that figure read as their budget, which is the behaviour
  # every language had before this list.
  hi: []
  # VERIFY: native-authored. Same rule.

# Asked, not offered. "Is it 750k?" is a question ABOUT the price, and
# reading it back as a budget is the same defect wearing no source word at all -
# the buyer's actual question goes unanswered.
#
# Kept apart from the source words above because it is cancelled by more: an
# AFFORDABILITY cue turns the same opener into the buyer asking whether THEIR
# amount is enough. "Is it 750k?" is our price; "Is this AED 800,000 enough for
# a studio?" is their budget.
interrogatives:
  en: ["is it", "is that", "is this", "is the"]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# Ownership is a first-person ANCHOR plus a MONEY TERM in the same segment, and
# it is what restores a figure the buyer claims as their own.
#
# Two lists rather than one list of phrases, because phrases were the bug. A
# fixed phrase list misses every modifier a buyer inserts - "I can ONLY spend 2
# crore" is not "I can spend" - and it made binding fragile: "my budget" starts
# four characters earlier than "budget", which was enough to reach the wrong
# figure. An anchor and a term anywhere in the same segment needs no distance
# rule at all.
#
# The anchor requirement is the other half. "The listing says AED 750,000 is
# affordable" and "buyers spend AED 750,000" are the LISTING talking, and
# treating a bare affordability or spending word as ownership recreated the
# original defect.
first_person:
  en: ["i", "me", "my", "mine", "we", "us", "our", "ours", "i'm", "i've", "we're", "we've"]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

money_terms:
  en:
    - budget
    - spend
    - spending
    - afford
    - affordable
    - "price range"
    - maximum
    - max
    - limit
    - available
    - works
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# Affordability cues, which cancel an INTERROGATIVE opener only - never a
# source word. "The listing says AED 750,000 is affordable" is still the
# listing talking; "Is this AED 800,000 enough?" is the buyer asking whether
# their own amount stretches.
affordability:
  en: [enough, afford, affordable, "too much", "within"]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# Contrastive conjunctions. These END a quoted claim: whole-segment attribution
# deliberately crosses a comma, which is right for a quoted range ("AED 750,000
# or AED 800,000") and wrong for a contrast ("the listing says AED 750,000, but
# I have AED 800,000"). The buyer's "but" is where their own talk begins.
contrasts:
  en: [but, however, though, although, whereas, instead]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# Dimensions: words that make a figure a MEASUREMENT rather than a sum.
#
# "m" is a money multiplier in data/numerals.yaml and the metre abbreviation in
# the exact domain this agent sells in, so once a folded unit was enough on its
# own, "I need a 2m wide balcony" took the deterministic budget turn and asked
# the buyer which currency their balcony was in. A budget keyword or an
# ownership phrase outranks these, so "my budget is 2m for a wide balcony" is
# still a budget.
dimensions:
  en:
    - wide
    - width
    - long
    - length
    - high
    - height
    - tall
    - deep
    - depth
    - ceiling
    - ceilings
    - balcony
    - terrace
    - room
    - rooms
    - metre
    - metres
    - meter
    - meters
    - square
    - sqft
    - "sq ft"
    - "floor area"
    - frontage
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# Negators: a currency these directly precede is being DENIED, not named.
# "Not dirhams" and "not in dirhams" deny dirhams; punctuation breaks the
# bind, so "no, dirhams" affirms them. A negator that is not denying a
# currency ("I'm not sure") reads as a contradiction of the read-back.
# "no" is quoted because YAML 1.1 reads it as a boolean, and a False in this
# list is silently unmatched rather than an error.
negators:
  en: ["not", "no", "never", "don't", "dont", "isn't", "isnt", "wasn't", "wasnt"]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# Contradictions: the buyer pushing back on what was read to them. A read-back
# answered with one of these is never consent - the policy asks for the
# amount again instead of settling it.
contradictions:
  en: ["no", "nope", "nah", "wrong", "incorrect", "mistake", "misheard"]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# Affirmations: explicit agreement with a read-back. Consent is never
# inferred from the absence of an objection - "can you repeat that?" is not
# a yes - so a read-back settles only on one of these (or on a currency
# word). A contradiction in the same reply wins over any of them.
affirmations:
  en: ["yes", "yeah", "yep", "yup", "correct", "right", "exactly", "indeed", "sure", "ok", "okay", "fine", "perfect", "absolutely"]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.
