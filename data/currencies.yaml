# Buyer-side currency recognition and conversion (ADR-011, docs/04-).
#
# This is INPUT recognition - the words a buyer says next to a number - and is
# a different list from `currency_tokens` in spoken-forms.yaml, which is the
# written tokens the OUTPUT swallows. A buyer says "rupees"; the agent never
# writes it.
#
# Why any of this exists: "do crore ka budget hai" is two crore of WHAT. INR
# 2 crore is roughly AED 880k; AED 2 crore is 20 million. Guessing wrong
# recommends a property off by up to 20x, in a warm confident voice.

# THE RATE IS NOT SET, AND THAT IS DELIBERATE.
#
# A made-up exchange rate spoken to a buyer is the same class of error as a
# made-up price: a specific, checkable, wrong number said with confidence.
# While `confirmed` is false the agent does not convert at all - it confirms
# the currency and hands a non-AED budget to a human, which is the honest
# answer and one worth showing.
#
# To switch conversion on, an operator sets a real rate, dates it, and flips
# `confirmed`. Nothing else changes.
rate:
  inr_per_aed: null
  as_of: null
  confirmed: false
  # VERIFY: with Binghatti's finance contact - the rate they quote buyers, and
  # how often it is refreshed. A stale rate is a wrong rate.

# Per language, because a buyer says the currency in the language they are
# speaking. Matched case-insensitively as whole words against the transcript.
words:
  en:
    AED: [aed, dirham, dirhams, dhs, dh]
    INR: [inr, rupee, rupees, rs]
  ar:
    AED: []
    INR: []
    # VERIFY: native-authored. Until these exist, an Arabic buyer naming a
    # currency reads as unstated, so the agent asks - which is the safe
    # direction, and no worse than not asking.
  hi:
    AED: []
    INR: []
    # VERIFY: native-authored. Same rule.

# Symbols are language-neutral: a transcript carries them whatever is spoken.
symbols:
  AED: []
  INR: ["₹"]

# Words that mark a number as a BUDGET rather than a bedroom count or a floor.
# Without these "three bedrooms" reads as a budget mention. A number carrying a
# currency or a lakh/crore/million multiplier needs no keyword - those say it
# on their own. Matched within a short window of the figure, not across the
# whole utterance, and kept to words that are ABOUT money: "around" and
# "looking at" were in this list once, and "I'm around floor 15" read as a
# budget of 15.
budget_keywords:
  en: [budget, spend, spending, afford, price range, up to, maximum, max]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# Whose figure is it (ADR-011, issue #25). The design is god's, round three:
# the deterministic layer decides only what is LOCALLY CONCLUSIVE from these
# closed lists, in a FIXED precedence, and every ambiguity falls to over-asking
# - which is ADR-011's safe direction. No distances, no bindings, no clever
# comma rules; three earlier mechanisms built from those all shipped adjacent
# regressions.
#
# THE PRECEDENCE, first match wins, per figure. `_PRECEDENCE` in
# ambassador/budget.py is the authority; this restates it for whoever is
# reading the word lists, and the two must not drift apart:
#   1. naming in its segment          -> budget
#   2. source in its segment          -> WITHHELD
#   3. affordability in its sentence  -> budget
#   4. question in its sentence       -> WITHHELD
#   5. dimension in its segment       -> WITHHELD  (ambiguous unit only)
#   6. budget keyword in its segment  -> budget
#   7. otherwise                      -> budget (over-ask)
# and a withheld figure is never selected while a live one exists.
#
# OWNERSHIP is deliberately NOT a step: it ranks below everything that
# withholds and its outcome equals the default, so it could never change an
# answer - checked by deleting it against every accumulated string. The MARK
# is still computed, because range fusion is cancelled by it.
#
# There are no distances anywhere. A mark applies to the segment or the
# sentence it is in, and nothing is bound to a figure by proximity.
#
# Read the direction before editing any list here. `source` and `question` are
# the only two that can LOSE a budget, and a missed budget is an unconfirmed
# twenty-times risk where an extra read-back costs one question.

# SOURCE: a noun and a verb together, never a bare noun. "After checking your
# website" marks nothing, because the buyer is describing what they did rather
# than quoting what the website said. This shape is what makes the mark
# conclusive instead of suggestive.
source_nouns:
  en: [listing, listings, website, site, page, brochure, advert, ad, portal, agent, seller, developer, you, they, he, she, it, price, prices, units, unit]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# SAYING verbs keep a first-person exemption: "I said 2 crore" is the buyer
# restating their own budget, and withholding that is the expensive direction.
# A quotative comma after one of these does not split the segment (G1), because
# the words being reported are the same claim as the verb reporting them.
saying_verbs:
  en: [says, say, said, tells, tell, told, quotes, quoted, mentions, mentioned, shows, showed, lists, listed, asks, asked, writes, wrote, advertised, calls, called, describes, described, states, stated, claims, claimed, advertises]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# PERCEPTION verbs take ANY subject, first person included: you do not SEE your
# own budget. "I saw AED 750,000 online" is a figure from somewhere else.
perception_verbs:
  en: [saw, see, seen, read, found, spotted, noticed, heard]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# Verbs that state a price directly, with any subject.
pricing_verbs:
  en: [costs, cost, "starts from", "starts at", "start from", "start at", "starting from", "starting at", "priced at", "goes for", "go for", asking, retails]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# COPULAR PRICE-NAMING: a price noun and a copula either side of the figure -
# "the price is X" and "X is the asking price" are both the seller's number.
# The mirror of naming_terms below, and the reason SOURCE needed more than a
# noun-plus-verb shape.
price_nouns:
  en: [price, prices, cost, "asking price", "list price", "listed price", "sale price", rate, premium]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# COPULAR-NAMING: the buyer naming a figure as their budget across a copula,
# in either order - "my budget is X" and "X is my budget". The strongest mark
# there is, so it outranks a source frame: "The website says AED 750,000 is my
# budget" is a budget of 750,000.
naming_terms:
  en: ["my budget", "our budget", "my maximum", "our maximum", "my max", "my limit", "our limit", "my price range", "our price range", "my ceiling"]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

copulas:
  en: [is, "is about", "is around", was, "will be", "would be", "'s", are, "comes to"]

# ANAPHORIC NAMING (G6): a pronoun standing in for the figure just mentioned,
# then a copula, then the buyer's own naming term - "750,000, which is my
# budget". Applies to the figure in the same segment or the one immediately
# before it, because that is what the pronoun refers to.
anaphora:
  en: [that, which, this, it]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# OWNERSHIP: a first-person anchor and a money term in the same segment. Weaker
# than a source frame on purpose - reported speech is full of first-person
# pronouns ("the agent told me I could afford 2m"), and treating those as the
# buyer speaking is what this precedence exists to stop.
first_person:
  en: ["i", "me", "my", "mine", "we", "us", "our", "ours", "i'm", "i've", "we're", "we've"]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

money_terms:
  en: [budget, spend, spending, afford, "price range", maximum, max, limit, available, works, "to work with"]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# AFFORDABILITY: a first-person affordability SHAPE, not a bare word. "Enough
# for me" is the buyer; "the listing says AED 750,000 is affordable" is the
# listing, and that is why this is a shape list and why a source frame still
# beats it.
affordability_shapes:
  en: ["enough for me", "enough for us", "enough for a", "can i afford", "can we afford", "could i afford", "could we afford", "i can afford", "we can afford", "afford it", "within my", "within our", "too much for me", "too much for us", "works for me", "works for us", "work for me", "work for us", "suits me", "suits us", "fine for me", "fine for us"]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# BARE affordability, approved amendment 3: these count as affordability only
# in a sentence carrying NO source mark. "Would 2 crore be enough" is the buyer
# asking whether their own figure stretches and there is nobody else in the
# sentence to attribute it to, so confirming is the over-ask direction ADR-011
# calls safe. "The listing says AED 750,000 is affordable" has a source mark and
# still withholds.
bare_affordability:
  en: [enough, "be enough", "too much", affordable, "in budget", "in range"]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# QUESTION: an auxiliary or copula opening the utterance. It marks every
# segment of its sentence, because "Is AED 750,000 the asking price?" puts the
# telling words after the figure. Four hard-coded "is + pronoun" phrases missed
# the whole class.
question_openers:
  en: [is, are, was, were, am, do, does, did, will, would, shall, should, can, could, may, might, has, have, had]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# RANGE FUSION: figures joined by nothing but one of these fuse into a single
# segment and share one fate. That is how a quoted range survives segmentation
# on every comma and conjunction: "says AED 750,000, and AED 800,000" is one
# quoted claim, while "750k works, and I have 800k" is two statements because
# words intervene.
range_connectors:
  en: [and, or, to, "up to", "through", "between"]

# Verbs a range may carry between its two figures without ceasing to be one
# range: "start at AED 750,000 and GO UP TO AED 900,000" (G2).
range_verbs:
  en: [go, goes, going, rise, rises, rising, climb, climbs, reach, reaches, run, runs, extend, extends]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# DIMENSIONS (G4): a measurement rather than a sum. Scoped to genuinely
# ambiguous unit surfaces only - a bare multiplier like "2m", which is both two
# million and two metres - and never to a plain-currency figure, because "I have
# AED 800,000 for a room" is a budget and a room does not make a currency
# ambiguous.
dimensions:
  en: [wide, width, long, length, high, height, tall, deep, depth, ceiling, ceilings, balcony, terrace, room, rooms, metre, metres, meter, meters, square, sqft, "sq ft", "floor area", frontage]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# Conjunctions that end a segment. Every comma does too, which is why range
# fusion above has to exist.
conjunctions:
  en: [and, or, but, however, though, although, whereas, plus]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# Negators: a currency these directly precede is being DENIED, not named.
# "Not dirhams" and "not in dirhams" deny dirhams; punctuation breaks the
# bind, so "no, dirhams" affirms them. A negator that is not denying a
# currency ("I'm not sure") reads as a contradiction of the read-back.
# "no" is quoted because YAML 1.1 reads it as a boolean, and a False in this
# list is silently unmatched rather than an error.
negators:
  en: ["not", "no", "never", "don't", "dont", "isn't", "isnt", "wasn't", "wasnt"]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# Contradictions: the buyer pushing back on what was read to them. A read-back
# answered with one of these is never consent - the policy asks for the
# amount again instead of settling it.
contradictions:
  en: ["no", "nope", "nah", "wrong", "incorrect", "mistake", "misheard"]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.

# Affirmations: explicit agreement with a read-back. Consent is never
# inferred from the absence of an objection - "can you repeat that?" is not
# a yes - so a read-back settles only on one of these (or on a currency
# word). A contradiction in the same reply wins over any of them.
affirmations:
  en: ["yes", "yeah", "yep", "yup", "correct", "right", "exactly", "indeed", "sure", "ok", "okay", "fine", "perfect", "absolutely"]
  ar: []
  # VERIFY: native-authored.
  hi: []
  # VERIFY: native-authored.
