  # VERIFY: ja uses English failure copy until native review.
  ja: "I do not want to quote you anything I cannot confirm. Let me put you through to one of our ambassadors."
  # VERIFY: de uses English failure copy until native review.
  de: "I do not want to quote you anything I cannot confirm. Let me put you through to one of our ambassadors."
  en: >-
    I do not want to quote you anything I cannot confirm.
    Let me put you through to one of our ambassadors.

  ar: >-
