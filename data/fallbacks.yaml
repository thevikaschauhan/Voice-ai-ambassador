  # VERIFY: zh uses English failure copy until native review.
  zh: "Let me be precise about that figure rather than guess."
  # VERIFY: ja uses English failure copy until native review.
  ja: "Let me be precise about that figure rather than guess."
  # VERIFY: de uses English failure copy until native review.
  de: "Let me be precise about that figure rather than guess."

  ar: "Let me be precise about that figure rather than guess."
  # VERIFY: native-authored Arabic bridge copy, day 3.

  hi: "Let me be precise about that figure rather than guess."
  # VERIFY: native-authored Hindi bridge copy, day 3.

fallback:
  # VERIFY: ru uses English failure copy until native review.
  ru: "I do not want to quote you anything I cannot confirm. Let me put you through to one of our ambassadors."
  # VERIFY: fr uses English failure copy until native review.
  fr: "I do not want to quote you anything I cannot confirm. Let me put you through to one of our ambassadors."
  # VERIFY: es uses English failure copy until native review.
  es: "I do not want to quote you anything I cannot confirm. Let me put you through to one of our ambassadors."
  # VERIFY: pt uses English failure copy until native review.
