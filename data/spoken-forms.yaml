# Closed-set spoken forms (ADR-009).
# One block per language, each with two keys:
#
#   currency_tokens  the written currency markers that may sit next to an
#                    amount. The spoken form below already names the currency,
#                    so a written token beside the digits is swallowed with them
#                    or the buyer hears the currency twice. Matched
#                    case-insensitively, on either side, with or without a
#                    separating space. Per language because the token a native
#                    spoken form has to swallow is a native word.
#   forms            keyed by (kind, value) or by exact surface (for quarters).
#
# Because only allowed figures can reach verbalisation, `forms` is COMPLETE by
# construction once it covers every CURRENCY figure in inventory.json (source
# and computed) plus the whitelist entries marked `kind: currency`. That is now
# checked rather than asserted - `verbalise.spoken_form_gaps()` reports what a
# language still owes, and a test holds English at zero.
#
# AUTHOR A FORM ONLY FOR MONEY, PERCENTS AND QUARTERS. The allowed set also
# holds square footages (420, 1200, 2100 ...) and Binghatti's hotline number,
# and those must have NO entry here. An amount's spoken form is allowed to
# swallow an adjacent "AED" precisely because the form names the currency
# itself, so a currency-naming form on a square footage makes the buyer hear
# "four hundred and twenty dirhams square feet". A bare quantity is read
# correctly by the digit fallback; leave it alone.
#
# English entries below are drafted by the build team.
# VERIFY: Arabic and Hindi entries must be AUTHORED BY A NATIVE SPEAKER
# (grammatical agreement in Arabic, lakh/crore conventions in Hindi -
# note AED 2,400,000 is 24 lakh, NOT 2.4 crore). Do not machine-fill them.

en:
  currency_tokens: [AED, Dhs, DHS, dh, dirham, dirhams]
  forms:
    # amounts (the spoken form names the currency; an adjacent token is consumed, prefix or suffix)
    - { kind: amount, value: 985000, spoken: "nine hundred and eighty-five thousand dirhams" }
    - { kind: amount, value: 197000, spoken: "one hundred and ninety-seven thousand dirhams" }
    - { kind: amount, value: 492500, spoken: "four hundred and ninety-two thousand five hundred dirhams" }
    - { kind: amount, value: 295500, spoken: "two hundred and ninety-five thousand five hundred dirhams" }
    - { kind: amount, value: 1200000, spoken: "one point two million dirhams" }
    - { kind: amount, value: 240000, spoken: "two hundred and forty thousand dirhams" }
    - { kind: amount, value: 480000, spoken: "four hundred and eighty thousand dirhams" }
    - { kind: amount, value: 650000, spoken: "six hundred and fifty thousand dirhams" }
    - { kind: amount, value: 65000, spoken: "sixty-five thousand dirhams" }
    - { kind: amount, value: 390000, spoken: "three hundred and ninety thousand dirhams" }
    - { kind: amount, value: 195000, spoken: "one hundred and ninety-five thousand dirhams" }
    - { kind: amount, value: 2000000, spoken: "two million dirhams" }
    # identifiers - read as a SEQUENCE, never as a quantity, and naming no
    # currency. A row with no `spoken` is a form that is OWED: it loads as
    # absent, so the digit fallback stays exactly as it is today, and
    # `verbalise.identifier_gaps()` reports it so the reviewer packet asks.
    # Keyed `kind: amount` on purpose - that is what the extractor calls a bare
    # five-digit integer, and it is the key `verbalise()` will look up, so a
    # form authored here is a form that is actually spoken.
    - kind: amount
      value: 80015
      verify: >-
        Binghatti's toll-free hotline, spoken when routing a buyer to a human.
        BOTH the real number and how it should be read aloud are client facts
        (issue #10) - digit by digit, grouped as 800-15, or the words a UAE
        caller expects. Until they are answered the digits go to TTS and are
        read as "eighty thousand and fifteen". Do not guess: a wrong hotline
        spoken warmly is worse than digits. When authored, it must NOT name a
        currency - it is not money.
    # percents
    - { kind: percent, value: 10, spoken: "ten per cent" }
    - { kind: percent, value: 20, spoken: "twenty per cent" }
    - { kind: percent, value: 30, spoken: "thirty per cent" }
    - { kind: percent, value: 40, spoken: "forty per cent" }
    - { kind: percent, value: 50, spoken: "fifty per cent" }
    - { kind: percent, value: 60, spoken: "sixty per cent" }
    # quarters (surface-keyed; replaced before the numeric pass)
    - { surface: "Q4 2026", spoken: "the fourth quarter of 2026" }
    - { surface: "Q3 2026", spoken: "the third quarter of 2026" }
    - { surface: "Q2 2027", spoken: "the second quarter of 2027" }

ar:
  # VERIFY: native-authored, day 3, alongside the forms below. The list must
  # name the Arabic currency word the spoken forms use AND any Latin token the
  # model writes in an Arabic reply. Empty = nothing is consumed, which is safe
  # only while the forms list is empty too.
  currency_tokens: []
  forms: []
  # VERIFY: native-authored, day 3. Empty list = digit fallback until then.

hi:
  # VERIFY: native-authored, day 3, alongside the forms below. The list must
  # name the Hindi currency word the spoken forms use AND any Latin token the
  # model writes in a Hindi reply. Empty = nothing is consumed, which is safe
  # only while the forms list is empty too.
  currency_tokens: []
  forms: []
  # VERIFY: native-authored, day 3. Empty list = digit fallback until then.
