# Pronunciation lexicon (docs/04-). Applied before synthesis.
# TTS is Fish Audio (ADR-014), which supports phoneme control for ENGLISH
# ONLY among our languages, in CMU Arpabet notation: the `arpabet` field.
# Arabic and Hindi voices rely on `respell` - alias respelling written into
# the text before synthesis.
# VERIFY: every entry BY EAR in every shipped voice during day 5 rehearsal.
# Mispronouncing "Binghatti" in their own boardroom is unrecoverable.

- term: Binghatti
  arpabet: null   # VERIFY: with the client - bin-GAT-ti
  respell: "bin-GAH-tee"
