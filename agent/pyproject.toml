[project]
name = "ambassador"
version = "0.1.0"
description = "Binghatti voice ambassador core - grounding, guardrails, verbalisation. Framework-free by design (ADR-002); the LiveKit adapter is added on day 1 and lives in src/adapter."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # The Phase 2 store (ADR-018). A main dependency rather than a group
    # member because BOTH Python services are database clients - the worker
    # persists a call, the admin API reads it - and neither is the voice
    # stack. The core-only gate still installs it and still passes: the
    # adapter's database tests gate on DATABASE_URL_TEST, not on the import.
    "asyncpg>=0.30",
    # Authenticated encryption for buyer-derived payloads (docs/10-).
    # A dependency rather than a hand-rolled construction because AEAD is
    # the canonical thing not to write yourself, and the admin API needs
    # the same envelope to read what the worker wrote.
    "cryptography>=43.0",
]

# `uv run eval` (docs/05-). Offline by default: no key, no network, no spend,
# so a prompt change cannot land unmeasured.
[project.scripts]
eval = "evals.cli:main"

[dependency-groups]
# `ruff` is pinned with `==` where everything else in this file uses `>=`, and
# the exception is the whole point of it being here. `ruff format` output is
# version-sensitive: a different minor version wraps some lines differently, so
# a floating range lets the formatter that produces a tree disagree with the
# `ruff format --check` gate that judges it, over a tree neither of them
# changed. The gate and the checklist both run `uv run ruff`, so this line is
# the single place the version is decided.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff==0.15.14",
]
# The voice stack is a group, not a main dependency, so that ADR-002 stays
# enforceable in practice rather than only on paper:
#   uv sync --no-group voice && uv run --no-sync pytest
# installs the core alone and still runs green - the core tests all pass and
# the adapter tests skip themselves. It is in default-groups because the
# adapter is now part of the build, so a plain `uv sync` produces a runnable
# agent.
#   livekit-agents          the framework itself (ADR-005)
#   livekit-plugins-openai  LLM via OpenRouter with a base_url override (ADR-016)
#   livekit-plugins-fishaudio  TTS, s2.1-pro (ADR-014)
#   livekit-plugins-silero  VAD for endpointing and for wrapping the
#                           non-streaming STT node in a StreamAdapter (ADR-015)
voice = [
    "livekit-agents>=1.7,<2",
    "livekit-plugins-openai>=1.7,<2",
    "livekit-plugins-fishaudio>=1.7,<2",
    "livekit-plugins-silero>=1.7,<2",
    "livekit-plugins-deepgram>=1.7,<2",
]

[tool.uv]
default-groups = ["dev", "voice"]
# Do not resolve to a just-published package. livekit-agents ships roughly
# weekly and 1.7.1 landed the morning this adapter was written; a client-facing
# demo should not be the first thing to run an hours-old release. Five days
# rather than seven because 1.7.0 shipped 2026-08-20T18:16Z and a 7-day window
# would have excluded it by five hours, dropping the resolution back to 1.6.x.
exclude-newer = "5 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ambassador", "src/adapter", "src/evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
