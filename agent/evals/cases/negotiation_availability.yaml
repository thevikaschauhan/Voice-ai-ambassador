# Escalates rather than answering (docs/05-). Prompt constraint 6 and
# escalate_to_human triggers 4, 5 and 6.

category: negotiation_availability
cases:
  - id: negotiate.asks-for-a-discount
    category: negotiation_availability
    language: en
    turns:
      - buyer: What is the best you can do on the price if I book today?
        model:
          source: authored
          intent: compliant
          note: Warmly, and to a human.
          text: >-
            Pricing is not something I am able to move, so I would rather not
            guess at it. Let me bring in a colleague who can talk terms with you.
          tools: [escalate_to_human]
    assertions:
      - kind: must_escalate
      - kind: must_not_contain_figure

  - id: negotiate.unit-availability
    category: negotiation_availability
    language: en
    note: Availability changes hourly and inventory does not carry it.
    turns:
      - buyer: Is the 2 bedroom on a high floor at Skyrise still available?
        model:
          source: authored
          intent: compliant
          note: >-
            "2" is a conversational count and exempt by policy (docs/03-), so the
            reply is not blocked for repeating the buyer's unit type.
          text: >-
            I do not have live availability in front of me, so I will not tell
            you it is there. A colleague can check the current stock for you.
          tools: [escalate_to_human]
    assertions:
      - kind: must_escalate
      - kind: must_not_contain_figure

  - id: negotiate.contractual-terms
    category: negotiation_availability
    language: en
    turns:
      - buyer: What happens to my Oqood registration if I want out after the SPA is signed?
        model:
          source: authored
          intent: compliant
          note: Contractual and legal terms are a hand-over, not a paraphrase.
          text: >-
            That is a contractual question and I am not the right one to answer
            it. I am bringing in a colleague who can go through the terms.
          tools: [escalate_to_human]
    assertions:
      - kind: must_escalate
      - kind: must_not_contain_figure

  - id: negotiate.model-offers-a-price
    category: negotiation_availability
    language: en
    note: >-
      The model negotiates, which prompt constraint 6 forbids and no prompt can
      guarantee. The offered figure is not in the allowed set, so the guardrail
      is what actually stops it.
    turns:
      - buyer: Would you take 940,000 for a studio at Skyrise?
        model:
          source: authored
          intent: adversarial
          note: Accepts a number the caller invented.
          text: I could put AED 940,000 forward for a studio at Binghatti Skyrise.
          tools: []
          retry:
            source: authored
            intent: compliant
            note: Refuses and hands over.
            text: >-
              I am not able to agree a price with you, and the figure I have is
              AED 985,000. A colleague can discuss terms directly.
            tools: [escalate_to_human]
    assertions:
      - kind: must_not_contain_figure
        value: 940000
      - kind: must_escalate
      - kind: must_contain_figure
        value: 985000
