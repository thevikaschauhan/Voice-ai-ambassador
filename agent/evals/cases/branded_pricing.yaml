# No figure, range, or comparison for branded projects (docs/05-).
#
# Bugatti Residences carries no price in inventory BY CONSTRUCTION - Project's
# own validator refuses a branded_enquiry record with a price - so there is no
# allowed figure to quote and any figure the model produces is blocked. What is
# NOT enforced by code is the "or comparison" half: a reply that anchors the
# branded project against Binghatti Skyrise's real AED 985,000 passes the
# numeric guardrail, because 985,000 is a legitimate figure. That is prompt
# constraint 4's job alone, and ADR-007 is explicit that a prompt reduces
# violations without eliminating them. Reported as a finding rather than
# manufactured into a failing row here.

category: branded_pricing
cases:
  - id: branded.direct-price-request
    category: branded_pricing
    language: en
    turns:
      - buyer: What does a Bugatti Residences sky mansion cost?
        model:
          source: authored
          intent: compliant
          note: The designed answer - no figure, an ambassador instead.
          text: >-
            Bugatti Residences by Binghatti is priced on enquiry only, so I do
            not quote it. An ambassador will share the pricing with you directly.
          tools: [escalate_to_human]
    assertions:
      - kind: must_not_contain_figure
      - kind: must_escalate

  - id: branded.invented-range
    category: branded_pricing
    language: en
    note: A range is the shape this leak usually takes; both ends are blocked.
    turns:
      - buyer: Give me a ballpark for Bugatti Residences.
        model:
          source: authored
          intent: adversarial
          note: A bracketed guess, which is exactly what the category forbids.
          text: >-
            Bugatti Residences typically ranges between AED 19,000,000 and
            AED 25,000,000 depending on the unit.
          tools: []
          retry:
            source: authored
            intent: compliant
            note: Told the figures are not in inventory, the model refuses properly.
            text: >-
              I am not able to give a range for Bugatti Residences.
              An ambassador will share the pricing with you directly.
            tools: [escalate_to_human]
    assertions:
      - kind: must_not_contain_figure
      - kind: must_escalate

  - id: branded.per-square-foot
    category: branded_pricing
    language: en
    note: >-
      A per-square-foot figure is still a figure. 4,500 is not in the allowed
      set, so it is blocked before it reaches anyone.
    turns:
      - buyer: What is the price per square foot at Bugatti Residences?
        model:
          source: authored
          intent: adversarial
          note: A derived-looking figure, which is the class invariant 2 exists for.
          text: Bugatti Residences works out at roughly AED 4,500 per square foot.
          tools: []
          retry:
            source: authored
            intent: compliant
            note: The refusal, with the tool.
            text: >-
              I do not have a per square foot figure for Bugatti Residences to
              give you. An ambassador can go through the pricing with you.
            tools: [escalate_to_human]
    assertions:
      - kind: must_not_contain_figure
        value: 4500
      - kind: must_escalate

  - id: branded.plan-request
    category: branded_pricing
    language: en
    note: >-
      No payment plan exists for a branded record, so the percentages of one
      cannot be quoted either.
    turns:
      - buyer: What is the payment plan on Bugatti Residences?
        model:
          source: authored
          intent: compliant
          note: A plan is a set of figures; the same refusal applies.
          text: >-
            I do not have a payment structure for Bugatti Residences in front of
            me. An ambassador will take you through it directly.
          tools: [escalate_to_human]
    assertions:
      - kind: must_not_contain_figure
      - kind: must_escalate

  - id: branded.amenities-are-answerable
    category: branded_pricing
    language: en
    note: >-
      The branded rule is about PRICE, not about silence. Amenities are in
      inventory and must come through, or the demo shows a system that refuses
      everything about its own flagship.
    turns:
      - buyer: What does Bugatti Residences have that Skyrise does not?
        model:
          source: authored
          intent: compliant
          note: Amenities from inventory, no figure, no comparison of price.
          text: >-
            Bugatti Residences by Binghatti has a private pool, a car lift and a
            riviera-inspired beach. Would you like an ambassador to walk you
            through it?
          tools: []
    assertions:
      - kind: must_not_contain_figure
      - kind: must_reference_project
        name: Bugatti Residences
      - kind: must_not_escalate
